<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقات جوري</title>
<meta name="description" content="قصص الأنبياء بالفيديو ومسابقات صفّية للصف السادس">
<meta property="og:title" content="مسابقات جوري">
<meta property="og:site_name" content="مسابقات جوري">
<meta property="og:description" content="قصص الأنبياء بالفيديو ومسابقات صفّية للصف السادس">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jorijabarin.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a class="brand" href="index.html">
      <span class="mark">ج</span>
      <span><b>مسابقات جوري</b><small>قصص الأنبياء · الصف السادس</small></span>
    </a>
  </header>

  <section class="intro">
    <h1>قصص الأنبياء: شاهِد، ثم تنافَس</h1>
    <p>اختاروا قصة، شاهدوا الفيديو معاً في الصف، ثم العبوا مسابقة الفرق على الشاشة الكبيرة. الأسئلة تتغيّر في كل مرة.</p>
    <ol class="steps">
      <li><b>١</b>اختاروا قصة</li>
      <li><b>٢</b>شاهدوا الفيديو</li>
      <li><b>٣</b>ابدؤوا المسابقة</li>
    </ol>
  </section>

  <main class="grid" id="grid" aria-live="polite">
    <p class="empty">جارٍ تحميل القصص…</p>
  </main>
</div>

<script src="data/index.js"></script>
<script>
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
// Our own covers instead of YouTube thumbnails (the thumbnails show drawn faces of prophets).
const COVER_HUES = [150, 200, 35, 45, 205, 190];
loadProphets(list => {
  const grid = document.getElementById('grid');
  if (!list.length) { grid.innerHTML = '<p class="empty">لا توجد قصص بعد.</p>'; return; }
  grid.innerHTML = '';
  list.forEach((p, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'story.html?p=' + p.id;
    a.innerHTML = `
      <div class="thumb cover" style="--hue:${COVER_HUES[i % COVER_HUES.length]}">
        <span class="cover-ic">${p.ic}</span>
        <span class="cover-name">${p.name}</span>
        <span class="num">${AR(i + 1)}</span>
        <span class="dur">${p.video.duration}</span>
      </div>
      <div class="body">
        <h2><span>${p.ic}</span>${p.name} عليه السلام</h2>
        <p>${p.blurb}</p>
        <span class="go">الفيديو والمسابقة ←</span>
      </div>`;
    grid.appendChild(a);
  });
});
</script>
</body>
</html>
